<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">How Vault handles your data</title>
  <desc id="d">You use the Vault app in your browser. Data is stored in IndexedDB on your device. Nothing goes to a server. Optional exports are encrypted with a passphrase you choose before they leave the device.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff9a72"/></marker>
  </defs>
  <rect width="1200" height="400" rx="24" fill="#1b1426"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="48" font-size="24" font-weight="700" fill="#ffffff">Your data never leaves your device unless you export it</text>

    <!-- boxes -->
    <rect x="50" y="110" width="220" height="110" rx="16" fill="#33274a" stroke="#ff7f50" stroke-opacity=".6"/>
    <text x="160" y="155" font-size="22" font-weight="700" fill="#ffffff">You</text>
    <text x="160" y="184" font-size="15" fill="#d9d2e6">add logins &amp; documents</text>

    <rect x="340" y="110" width="240" height="110" rx="16" fill="#33274a" stroke="#ff7f50" stroke-opacity=".6"/>
    <text x="460" y="155" font-size="22" font-weight="700" fill="#ffffff">Vault app</text>
    <text x="460" y="184" font-size="15" fill="#d9d2e6">one HTML file, runs offline</text>

    <rect x="650" y="110" width="240" height="110" rx="16" fill="#33274a" stroke="#ff7f50"/>
    <text x="770" y="155" font-size="22" font-weight="700" fill="#ffffff">IndexedDB</text>
    <text x="770" y="184" font-size="15" fill="#d9d2e6">stored in this browser only</text>

    <!-- arrows -->
    <path d="M272 165 H336" stroke="#ff9a72" stroke-width="3" fill="none" marker-end="url(#ar)"/>
    <path d="M582 165 H646" stroke="#ff9a72" stroke-width="3" fill="none" marker-end="url(#ar)"/>

    <!-- device boundary -->
    <rect x="30" y="88" width="880" height="152" rx="22" fill="none" stroke="#9be0cf" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="470" y="262" font-size="15" fill="#9be0cf">Everything above stays on your device</text>

    <!-- no server -->
    <g opacity=".95">
      <path d="M1000 160 a28 28 0 0 1 28-26 a34 34 0 0 1 66 8 a22 22 0 0 1 4 44 H1006 a20 20 0 0 1-6-26 Z" fill="#2a2038" stroke="#8d82a3" stroke-width="2"/>
      <path d="M1000 118 L1100 206" stroke="#ff6b6b" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="1050" y="236" font-size="15" font-weight="600" fill="#ffb3b3">No servers · No accounts</text>
    <text x="1050" y="257" font-size="15" font-weight="600" fill="#ffb3b3">No tracking</text>

    <!-- export branch -->
    <path d="M770 222 V300" stroke="#ff9a72" stroke-width="3" stroke-dasharray="6 6" fill="none" marker-end="url(#ar)"/>
    <text x="800" y="268" font-size="14" fill="#d9d2e6" text-anchor="start">only if you export</text>
    <rect x="590" y="304" width="360" height="70" rx="16" fill="#2b2140" stroke="#9be0cf"/>
    <text x="770" y="333" font-size="18" font-weight="700" fill="#ffffff">Encrypted backup / share file</text>
    <text x="770" y="357" font-size="14" fill="#d9d2e6">AES-256-GCM · PBKDF2 · passphrase never stored</text>
  </g>
</svg>
