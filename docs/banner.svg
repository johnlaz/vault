<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Vault</title>
  <desc id="d">Vault: a private, local-first credential and document manager with Personal and Business spaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241b33"/><stop offset="1" stop-color="#130e1b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa27a"/><stop offset="1" stop-color="#e0592a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1090" cy="160" r="150" fill="none" stroke="#ff7f50" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="1090" cy="160" r="110" fill="none" stroke="#ff7f50" stroke-opacity=".28" stroke-width="2"/>
  <!-- shield + lock -->
  <path d="M1090 70 L1155 94 V164 C1155 208 1125 236 1090 252 C1055 236 1025 208 1025 164 V94 Z" fill="#33274a" stroke="#ff7f50" stroke-width="3"/>
  <path d="M1066 148 V132 a24 24 0 0 1 48 0 V148" fill="none" stroke="#d9d2e6" stroke-width="7" stroke-linecap="round"/>
  <rect x="1054" y="146" width="72" height="56" rx="10" fill="url(#acc)"/>
  <circle cx="1090" cy="170" r="7" fill="#241b33"/><rect x="1086.5" y="172" width="7" height="16" rx="3" fill="#241b33"/>
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="72" y="140" font-size="84" font-weight="700" fill="#ffffff">Vault</text>
  </g>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="74" y="188" font-size="26" fill="#d9d2e6">Every login and document, in one private vault.</text>
    <g font-size="17" font-weight="600">
      <rect x="72" y="224" width="108" height="36" rx="18" fill="#ff7f50" fill-opacity=".18" stroke="#ff7f50" stroke-opacity=".6"/><text x="126" y="248" text-anchor="middle" fill="#ffc2a8">Personal</text>
      <rect x="192" y="224" width="108" height="36" rx="18" fill="#ff7f50" fill-opacity=".18" stroke="#ff7f50" stroke-opacity=".6"/><text x="246" y="248" text-anchor="middle" fill="#ffc2a8">Business</text>
      <rect x="312" y="224" width="140" height="36" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".25"/><text x="382" y="248" text-anchor="middle" fill="#e9e4f2">Local-first</text>
      <rect x="464" y="224" width="188" height="36" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".25"/><text x="558" y="248" text-anchor="middle" fill="#e9e4f2">Encrypted exports</text>
      <rect x="664" y="224" width="140" height="36" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".25"/><text x="734" y="248" text-anchor="middle" fill="#e9e4f2">Works offline</text>
    </g>
  </g>
